[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chainpwn"
version = "0.1.0"
description = "Automated CTF/pentest orchestrator wrapping existing Kali tools"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "loguru>=0.7",
  "pyyaml>=6.0",
  "aiohttp>=3.9",
  "lxml>=5.0",
  "jinja2>=3.1",
  "pymetasploit3>=1.0.6",
  "python-libnmap>=0.7.3",
  "requests>=2.31",
]

[project.scripts]
chainpwn = "chainpwn:app"

[tool.setuptools]
py-modules = ["chainpwn"]

[tool.setuptools.packages.find]
include = ["core*", "wrappers*", "matcher*", "executors*", "post*", "utils*", "reports*"]
